        // Initialize with default PolySynth
        function initializeInstrument() {
            if (currentInstrument) {
                currentInstrument.dispose();
            }
            currentInstrument = createInstrument(currentInstrumentType);
        }
        
        // Create instrument based on type
        function createInstrument(type) {
            let instrument;
            try {
                switch(type) {
                    case 'PolySynth':
                        instrument = new Tone.PolySynth(Tone.Synth).toDestination();
                        break;
                    case 'MonoSynth':
                        instrument = new Tone.MonoSynth().toDestination();
                        break;
                    case 'FMSynth':
                        instrument = new Tone.PolySynth(Tone.FMSynth).toDestination();
                        break;
                    case 'AMSynth':
                        instrument = new Tone.PolySynth(Tone.AMSynth).toDestination();
                        break;
                    case 'DuoSynth':
                        instrument = new Tone.PolySynth(Tone.DuoSynth).toDestination();
                        break;
                    case 'PluckSynth':
                        instrument = new Tone.PolySynth(Tone.PluckSynth).toDestination();
                        break;
                    case 'MembraneSynth':
                        instrument = new Tone.MembraneSynth().toDestination();
                        break;
                    case 'MetalSynth':
                        instrument = new Tone.MetalSynth().toDestination();
                        break;
                    case 'Sampler':
                        instrument = sampler;
                        break;
                    default:
                        instrument = new Tone.PolySynth(Tone.Synth).toDestination();
                }
                
                // Apply saved parameters
                applyParametersToInstrument(instrument, type);
                
                console.log(`Loaded instrument: ${type}`);
                return instrument;
            } catch (error) {
                console.error(`Error creating instrument ${type}:`, error);
                return new Tone.PolySynth(Tone.Synth).toDestination();
            }
        }
        
        // Apply parameters to instrument
        function applyParametersToInstrument(instrument, type) {
            if (type === 'Sampler' || !parameterDefinitions[type]) return;
            
            const params = instrumentParameters[type];
            const defs = parameterDefinitions[type];
            
            Object.values(defs).flat().forEach(def => {
                const value = params[def.name] !== undefined ? params[def.name] : def.default;
                setInstrumentParameter(instrument, type, def.name, value);
            });
        }
        
        // Set a single parameter on an instrument
        function setInstrumentParameter(instrument, type, paramName, value) {
            if (!instrument || type === 'Sampler') return;
            
            try {
                const isPolySynth = ['PolySynth', 'FMSynth', 'AMSynth', 'DuoSynth', 'PluckSynth'].includes(type);
                const target = isPolySynth ? instrument.voices[0] : instrument;
                
                // Map parameter names to Tone.js paths
                const paramMap = {
                    // Oscillator
                    'type': 'oscillator.type',
                    'detune': 'oscillator.detune',
                    'phase': 'oscillator.phase',
                    
                    // Envelope
                    'attack': 'envelope.attack',
                    'decay': 'envelope.decay',
                    'sustain': 'envelope.sustain',
                    'release': 'envelope.release',
                    
                    // Filter
                    'filterType': 'filter.type',
                    'filterFrequency': 'filter.frequency',
                    'filterQ': 'filter.Q',
                    'filterRolloff': 'filter.rolloff',
                    
                    // Filter Envelope
                    'filterAttack': 'filterEnvelope.attack',
                    'filterDecay': 'filterEnvelope.decay',
                    'filterSustain': 'filterEnvelope.sustain',
                    'filterRelease': 'filterEnvelope.release',
                    'filterBaseFrequency': 'filterEnvelope.baseFrequency',
                    'filterOctaves': 'filterEnvelope.octaves',
                    
                    // FM/AM Synth
                    'carrierType': 'oscillator.type',
                    'carrierDetune': 'oscillator.detune',
                    'modulatorType': 'modulationEnvelope.type',
                    'modulationIndex': 'modulationIndex',
                    'harmonicity': 'harmonicity',
                    
                    // Modulation Envelope
                    'modAttack': 'modulationEnvelope.attack',
                    'modDecay': 'modulationEnvelope.decay',
                    'modSustain': 'modulationEnvelope.sustain',
                    'modRelease': 'modulationEnvelope.release',
                    
                    // DuoSynth voices
                    'voice0Type': 'voice0.oscillator.type',
                    'voice0Detune': 'voice0.oscillator.detune',
                    'voice0Volume': 'voice0.volume',
                    'voice1Type': 'voice1.oscillator.type',
                    'voice1Detune': 'voice1.oscillator.detune',
                    'voice1Volume': 'voice1.volume',
                    'vibratoAmount': 'vibratoAmount',
                    'vibratoRate': 'vibratoRate',
                    
                    // PluckSynth
                    'attackNoise': 'attackNoise',
                    'dampening': 'dampening',
                    'resonance': 'resonance',
                    
                    // MembraneSynth / MetalSynth
                    'pitchDecay': 'pitchDecay',
                    'octaves': 'octaves',
                    'frequency': 'frequency',
                    
                    // Voice
                    'portamento': 'portamento',
                    'volume': 'volume'
                };
                
                const path = paramMap[paramName];
                if (!path) return;
                
                const parts = path.split('.');
                let obj = target;
                
                for (let i = 0; i < parts.length - 1; i++) {
                    if (obj[parts[i]]) {
                        obj = obj[parts[i]];
                    } else {
                        return;
                    }
                }
                
                const finalProp = parts[parts.length - 1];
                if (obj[finalProp] !== undefined) {
                    if (typeof obj[finalProp] === 'object' && obj[finalProp].value !== undefined) {
                        obj[finalProp].value = value;
                    } else {
                        obj[finalProp] = value;
                    }
                }
                
                // Store parameter
                instrumentParameters[type][paramName] = value;
                
            } catch (error) {
                console.warn(`Error setting parameter ${paramName}:`, error);
            }
        }
        
        // Handle instrument change
        function handleInstrumentChange(type) {
            const wasPlaying = Tone.Transport.state === 'started';
            if (wasPlaying) {
                handleStop();
            }
            
            currentInstrumentType = type;
            initializeInstrument();
            
            if (wasPlaying && midiData) {
                setTimeout(() => {
                    handlePlayPause();
                }, 100);
            }
        }

        // --- Constants ---
        const NOTE_HEIGHT = 16;
        const MIDI_NOTE_RANGE = { min: 21, max: 108 };

        // --- Initialization ---
        window.onload = () => {
            setupPianoKeys();
            setupToolbar();
            setupSubdivisionControls();
            setupGridInteraction();
            initializeInstrument();
            draw();
            Tone.Transport.bpm.value = parseInt(tempoInput.value, 10);
            const sig = signatureSelect.value.split('/').map(n => parseInt(n));
            Tone.Transport.timeSignature = sig;
        };

        // --- Event Listeners ---
        uploadInput.addEventListener('change', handleFileUpload);
        exportButton.addEventListener('click', handleExport);
        tempoInput.addEventListener('change', (e) => {
            const tempo = parseInt(e.target.value, 10) || 120;
            Tone.Transport.bpm.value = tempo;
            draw();
        });
        signatureSelect.addEventListener('change', (e) => {
            const sig = e.target.value.split('/').map(n => parseInt(n));
            Tone.Transport.timeSignature = sig;
            draw();
        });
        zoomRange.addEventListener('input', (e) => {
            zoom = parseInt(e.target.value, 10);
            draw();
        });
        gridContainer.addEventListener('scroll', () => {
            pianoKeysSVG.style.marginTop = `-${gridContainer.scrollTop}px`;
            timelineHeader.scrollLeft = gridContainer.scrollLeft;
        });

        playBtn.addEventListener('click', handlePlayPause);
        stopBtn.addEventListener('click', handleStop);
        rewindBtn.addEventListener('click', handleRewind);
        prevMeasureBtn.addEventListener('click', handlePrevMeasure);
        nextMeasureBtn.addEventListener('click', handleNextMeasure);
        snapEnabledCheckbox.addEventListener('change', (e) => {
            snapToGrid = e.target.checked;
        });
        loopBtn.addEventListener('click', toggleLoop);
        instrumentSelect.addEventListener('change', (e) => {
            handleInstrumentChange(e.target.value);
        });
        expandParamsBtn.addEventListener('click', () => {
            showPluginInterface();
        });
        pluginClose.addEventListener('click', () => {
            hidePluginInterface();
        });
        
        // Make plugin window draggable
        let isDraggingPlugin = false;
        let pluginDragOffset = { x: 0, y: 0 };
        
        pluginHeader.addEventListener('mousedown', (e) => {
            isDraggingPlugin = true;
            const rect = pluginInterface.getBoundingClientRect();
            pluginDragOffset.x = e.clientX - rect.left;
            pluginDragOffset.y = e.clientY - rect.top;
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDraggingPlugin) {
                pluginInterface.style.left = `${e.clientX - pluginDragOffset.x}px`;
                pluginInterface.style.top = `${e.clientY - pluginDragOffset.y}px`;
                pluginInterface.style.transform = 'none';
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDraggingPlugin = false;
        });
        
        // Timeline click to set playback position
        timelineContainer.addEventListener('click', (e) => {
            const rect = timelineContainer.getBoundingClientRect();
            const x = e.clientX - rect.left + timelineHeader.scrollLeft;
            const time = x / zoom;
            setPlaybackPosition(time);
        });

        // --- Playback Position Management ---
        function setPlaybackPosition(time) {
            Tone.Transport.seconds = Math.max(0, time);
            updatePlaybackDisplay();
        }

        function updatePlaybackDisplay() {
            const currentTime = Tone.Transport.seconds;
            const beatsPerMeasure = Tone.Transport.timeSignature[0];
            const secondsPerBeat = 60 / Tone.Transport.bpm.value;
            
            const totalBeats = currentTime / secondsPerBeat;
            const measure = Math.floor(totalBeats / beatsPerMeasure) + 1;
            const beat = Math.floor(totalBeats % beatsPerMeasure) + 1;
            const subdivision = Math.floor((totalBeats % 1) * (currentSubdivision / 4));
            const tick = Math.floor(((totalBeats % 1) * (currentSubdivision / 4) % 1) * 1000);
            
            playbackPosition.textContent = `${measure}:${beat}:${subdivision.toString().padStart(2, '0')}:${tick.toString().padStart(3, '0')}`;
        }

        function toggleLoop() {
            isLooping = !isLooping;
            loopBtn.classList.toggle('active', isLooping);
            loopRegion.style.display = isLooping ? 'block' : 'none';
            
            if (isLooping) {
                Tone.Transport.loop = true;
                Tone.Transport.loopStart = loopStart;
                Tone.Transport.loopEnd = loopEnd;
                updateLoopRegionDisplay();
            } else {
                Tone.Transport.loop = false;
            }
        }

        function updateLoopRegionDisplay() {
            const startX = loopStart * zoom;
            const endX = loopEnd * zoom;
            const width = endX - startX;
            
            loopRegion.style.left = `${startX}px`;
            loopRegion.style.width = `${width}px`;
        }

        // --- Transport Navigation ---
        function handlePrevMeasure() {
            const beatsPerMeasure = Tone.Transport.timeSignature[0];
            const secondsPerBeat = 60 / Tone.Transport.bpm.value;
            const secondsPerMeasure = secondsPerBeat * beatsPerMeasure;
            
            const currentTime = Tone.Transport.seconds;
            const currentMeasure = Math.floor(currentTime / secondsPerMeasure);
            const newTime = Math.max(0, currentMeasure * secondsPerMeasure);
            
            setPlaybackPosition(newTime);
            updatePlaybackCursor();
        }

        function handleNextMeasure() {
            const beatsPerMeasure = Tone.Transport.timeSignature[0];
            const secondsPerBeat = 60 / Tone.Transport.bpm.value;
            const secondsPerMeasure = secondsPerBeat * beatsPerMeasure;
            
            const currentTime = Tone.Transport.seconds;
            const nextMeasure = Math.floor(currentTime / secondsPerMeasure) + 1;
            const newTime = nextMeasure * secondsPerMeasure;
            
            setPlaybackPosition(newTime);
            updatePlaybackCursor();
        }

        // --- File & MIDI Handling ---
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            try {
                const arrayBuffer = await file.arrayBuffer();
                midiData = new Midi(arrayBuffer);
                exportButton.disabled = false;
                
                if (midiData.header.tempos.length > 0) {
                    const tempo = Math.round(midiData.header.tempos[0].bpm);
                    tempoInput.value = tempo;
                    Tone.Transport.bpm.value = tempo;
                }
                if (midiData.header.timeSignatures.length > 0) {
                    const sig = midiData.header.timeSignatures[0].timeSignature;
                    const sigString = `${sig[0]}/${sig[1]}`;
                    if ([...signatureSelect.options].some(o => o.value === sigString)) {
                        signatureSelect.value = sigString;
                        Tone.Transport.timeSignature = sig;
                    }
                }
                draw();
            } catch (error) {
                console.error("Error parsing MIDI file:", error);
                alert("Could not parse the MIDI file.");
            }
        }

        function handleExport() {
            if (!midiData) return;
            try {
                const midiArray = midiData.toArray();
                const blob = new Blob([midiArray], { type: "audio/midi" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `${midiData.name || 'exported_midi'}.mid`;
                a.click();
                URL.revokeObjectURL(a.href);
            } catch (error) {
                console.error("Error exporting MIDI file:", error);
            }
        }
        
        // --- Time Management Functions ---
        function setupSubdivisionControls() {
            const subdivisionBtns = document.querySelectorAll('.subdivision-btn');
            subdivisionBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    subdivisionBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSubdivision = parseInt(btn.dataset.subdivision);
                    draw();
                });
            });
        }

        function getTimeForPosition(x) {
            const rawTime = x / zoom;
            if (!snapToGrid) return rawTime;
            
            const secondsPerBeat = 60 / Tone.Transport.bpm.value;
            const secondsPerSubdivision = secondsPerBeat / (currentSubdivision / 4);
            return Math.round(rawTime / secondsPerSubdivision) * secondsPerSubdivision;
        }

        function getPositionForTime(time) {
            return time * zoom;
        }

        function getQuantizedDuration(duration) {
            if (!snapToGrid) return Math.max(duration, 0.1);
            
            const secondsPerBeat = 60 / Tone.Transport.bpm.value;
            const minDuration = secondsPerBeat / (currentSubdivision / 4);
            const quantizedDuration = Math.max(Math.round(duration / minDuration) * minDuration, minDuration);
            return quantizedDuration;
        }

        function getNoteFromY(y) {
            const noteIndex = Math.floor(y / NOTE_HEIGHT);
            return MIDI_NOTE_RANGE.max - noteIndex;
        }

        function getYFromNote(midi) {
            const noteIndex = MIDI_NOTE_RANGE.max - midi;
            return noteIndex * NOTE_HEIGHT;
        }

        // --- Grid Interaction ---
        function setupGridInteraction() {
            let startX, startNote, originalX;
            
            gridContainer.addEventListener('mousedown', (e) => {
                if (e.button === 2) { // Right click
                    e.preventDefault();
                    const target = e.target;
                    if (target.classList.contains('note') && !target.classList.contains('preview')) {
                        // Right click on note - show context menu
                        const noteElement = target;
                        if (!selectedNotes.has(noteElement)) {
                            clearSelection();
                            selectNote(noteElement);
                        }
                        showContextMenu(e.clientX, e.clientY);
                    } else {
                        // Right click on empty space - start delete mode
                        isRightClickDeleting = true;
                        hideContextMenu();
                    }
                    return;
                }
                
                if (e.button !== 0) return; // Only left click continues
                
                hideContextMenu();
                
                if (activeTool === 'select') {
                    const target = e.target;
                    if (target.classList.contains('note') && !target.classList.contains('preview')) {
                        // Clicked on a note
                        if (!e.shiftKey && !selectedNotes.has(target)) {
                            clearSelection();
                        }
                        selectNote(target);
                        isDraggingNotes = true;
                        dragStartY = e.clientY;
                        // Store original MIDI values
                        noteDragData = Array.from(selectedNotes).map(noteEl => ({
                            element: noteEl,
                            originalMidi: parseInt(noteEl.dataset.midi)
                        }));
                    } else {
                        // Clicked on empty space - start selection rectangle
                        if (!e.shiftKey) clearSelection();
                        isSelecting = true;
                        const rect = gridContainer.getBoundingClientRect();
                        selectionStart = {
                            x: e.clientX - rect.left + gridContainer.scrollLeft,
                            y: e.clientY - rect.top + gridContainer.scrollTop
                        };
                    }
                } else if (activeTool === 'pencil') {
                    handlePencilDown(e);
                }
            });

            gridContainer.addEventListener('mousemove', (e) => {
                if (isRightClickDeleting) {
                    // Right click drag to delete notes
                    const target = e.target;
                    if (target.classList.contains('note') && !target.classList.contains('preview')) {
                        deleteNoteElement(target);
                    }
                } else if (isDraggingNotes) {
                    // Drag selected notes up/down
                    const deltaY = e.clientY - dragStartY;
                    const semitoneDelta = -Math.round(deltaY / NOTE_HEIGHT);
                    
                    noteDragData.forEach(data => {
                        const newMidi = data.originalMidi + semitoneDelta;
                        if (newMidi >= MIDI_NOTE_RANGE.min && newMidi <= MIDI_NOTE_RANGE.max) {
                            data.element.dataset.midi = newMidi;
                            const y = getYFromNote(newMidi);
                            data.element.style.top = `${y}px`;
                        }
                    });
                } else if (isSelecting && selectionStart) {
                    // Update selection rectangle
                    const rect = gridContainer.getBoundingClientRect();
                    const currentX = e.clientX - rect.left + gridContainer.scrollLeft;
                    const currentY = e.clientY - rect.top + gridContainer.scrollTop;
                    
                    const left = Math.min(selectionStart.x, currentX);
                    const top = Math.min(selectionStart.y, currentY);
                    const width = Math.abs(currentX - selectionStart.x);
                    const height = Math.abs(currentY - selectionStart.y);
                    
                    selectionRectangle.style.left = `${left}px`;
                    selectionRectangle.style.top = `${top}px`;
                    selectionRectangle.style.width = `${width}px`;
                    selectionRectangle.style.height = `${height}px`;
                    selectionRectangle.style.display = 'block';
                    
                    // Select notes within rectangle
                    updateSelectionFromRectangle(left, top, width, height);
                } else if (activeTool === 'pencil') {
                    handlePencilMove(e);
                }
                
                if (snapToGrid && activeTool === 'pencil') {
                    updateSnapIndicator(e);
                }
            });

            gridContainer.addEventListener('mouseup', (e) => {
                if (isRightClickDeleting) {
                    isRightClickDeleting = false;
                    return;
                }
                
                if (isDraggingNotes) {
                    // Finalize note drag
                    noteDragData.forEach(data => {
                        const newMidi = parseInt(data.element.dataset.midi);
                        updateNoteInMidiData(data.element, newMidi);
                    });
                    isDraggingNotes = false;
                    noteDragData = [];
                    drawPianoRoll();
                }
                
                if (isSelecting) {
                    isSelecting = false;
                    selectionStart = null;
                    selectionRectangle.style.display = 'none';
                }
                
                if (activeTool === 'pencil') {
                    handlePencilUp(e);
                }
            });

            gridContainer.addEventListener('contextmenu', (e) => {
                e.preventDefault(); // Prevent default context menu
            });

            gridContainer.addEventListener('mouseleave', () => {
                hideSnapIndicator();
                if (previewNote) {
                    previewNote.remove();
                    previewNote = null;
                }
            });
        }

        // --- Note Selection Functions ---
        function selectNote(noteElement) {
            noteElement.classList.add('selected');
            selectedNotes.add(noteElement);
        }

        function deselectNote(noteElement) {
            noteElement.classList.remove('selected');
            selectedNotes.delete(noteElement);
        }

        function clearSelection() {
            selectedNotes.forEach(note => note.classList.remove('selected'));
            selectedNotes.clear();
        }

        function selectAllNotes() {
            const allNotes = noteContainer.querySelectorAll('.note:not(.preview)');
            allNotes.forEach(note => selectNote(note));
        }

        function updateSelectionFromRectangle(left, top, width, height) {
            const right = left + width;
            const bottom = top + height;
            
            const allNotes = noteContainer.querySelectorAll('.note:not(.preview)');
            allNotes.forEach(note => {
                const noteLeft = parseFloat(note.style.left);
                const noteTop = parseFloat(note.style.top);
                const noteRight = noteLeft + parseFloat(note.style.width);
                const noteBottom = noteTop + parseFloat(note.style.height);
                
                // Check if note intersects with selection rectangle
                const intersects = !(noteRight < left || noteLeft > right || 
                                   noteBottom < top || noteTop > bottom);
                
                if (intersects) {
                    selectNote(note);
                } else if (!isSelecting) {
                    deselectNote(note);
                }
            });
        }

        // --- Note Manipulation Functions ---
        function deleteSelectedNotes() {
            if (selectedNotes.size === 0) return;
            
            selectedNotes.forEach(noteElement => {
                deleteNoteElement(noteElement);
            });
            
            clearSelection();
            drawPianoRoll();
        }

        function deleteNoteElement(noteElement) {
            const trackIndex = parseInt(noteElement.dataset.track);
            const noteIndex = parseInt(noteElement.dataset.index);
            
            if (midiData && midiData.tracks[trackIndex]) {
                midiData.tracks[trackIndex].notes.splice(noteIndex, 1);
            }
            
            noteElement.remove();
            selectedNotes.delete(noteElement);
        }

        function transposeSelectedNotes(semitones) {
            if (selectedNotes.size === 0) return;
            
            selectedNotes.forEach(noteElement => {
                const currentMidi = parseInt(noteElement.dataset.midi);
                const newMidi = currentMidi + semitones;
                
                // Validate range
                if (newMidi >= MIDI_NOTE_RANGE.min && newMidi <= MIDI_NOTE_RANGE.max) {
                    noteElement.dataset.midi = newMidi;
                    const y = getYFromNote(newMidi);
                    noteElement.style.top = `${y}px`;
                    updateNoteInMidiData(noteElement, newMidi);
                }
            });
            
            drawPianoRoll();
        }

        function updateNoteInMidiData(noteElement, newMidi) {
            const trackIndex = parseInt(noteElement.dataset.track);
            const noteIndex = parseInt(noteElement.dataset.index);
            
            if (midiData && midiData.tracks[trackIndex] && midiData.tracks[trackIndex].notes[noteIndex]) {
                const note = midiData.tracks[trackIndex].notes[noteIndex];
                note.midi = newMidi;
                note.name = Tone.Midi(newMidi).toNote();
            }
        }

        // --- Pencil Tool Functions ---
        function handlePencilDown(e) {
            const rect = gridContainer.getBoundingClientRect();
            const x = e.clientX - rect.left + gridContainer.scrollLeft;
            const y = e.clientY - rect.top + gridContainer.scrollTop;
            
            const time = getTimeForPosition(x);
            const midi = getNoteFromY(y);
            
            if (midi < MIDI_NOTE_RANGE.min || midi > MIDI_NOTE_RANGE.max) return;
            
            isDrawing = true;
            startX = x;
            startNote = { time, midi };
            
            createPreviewNote(time, midi, 0.25); // Default quarter note duration
            e.preventDefault();
        }

        function handlePencilMove(e) {
            if (!isDrawing || !startNote) return;
            
            const rect = gridContainer.getBoundingClientRect();
            const currentX = e.clientX - rect.left + gridContainer.scrollLeft;
            const duration = Math.max(getTimeForPosition(currentX) - startNote.time, 0.1);
            const quantizedDuration = getQuantizedDuration(duration);
            
            if (previewNote) {
                previewNote.style.width = `${quantizedDuration * zoom}px`;
            }
        }

        function handlePencilUp(e) {
            if (!isDrawing || !startNote) return;
            
            const rect = gridContainer.getBoundingClientRect();
            const endX = e.clientX - rect.left + gridContainer.scrollLeft;
            const duration = Math.max(getTimeForPosition(endX) - startNote.time, 0.1);
            const quantizedDuration = getQuantizedDuration(duration);
            
            // Add note to MIDI data
            addNoteToMidiData(startNote.time, startNote.midi, quantizedDuration, 0.8);
            
            // Clean up
            if (previewNote) {
                previewNote.remove();
                previewNote = null;
            }
            
            isDrawing = false;
            startNote = null;
            
            // Redraw to show the actual note
            drawPianoRoll();
        }

        function createPreviewNote(time, midi, duration) {
            if (previewNote) {
                previewNote.remove();
            }
            
            const noteDiv = document.createElement('div');
            noteDiv.classList.add('note', 'preview');
            
            const y = getYFromNote(midi);
            const x = getPositionForTime(time);
            const width = duration * zoom;
            
            noteDiv.style.top = `${y}px`;
            noteDiv.style.left = `${x}px`;
            noteDiv.style.width = `${width}px`;
            noteDiv.style.height = `${NOTE_HEIGHT - 2}px`;
            
            noteContainer.appendChild(noteDiv);
            previewNote = noteDiv;
        }

        function updateSnapIndicator(e) {
            const rect = gridContainer.getBoundingClientRect();
            const x = e.clientX - rect.left + gridContainer.scrollLeft;
            const snappedTime = getTimeForPosition(x);
            const snappedX = getPositionForTime(snappedTime);
            
            snapIndicator.style.left = `${snappedX}px`;
            snapIndicator.style.display = 'block';
        }

        function hideSnapIndicator() {
            snapIndicator.style.display = 'none';
        }

        function addNoteToMidiData(time, midi, duration, velocity = 0.8) {
            if (!midiData) {
                // Create new MIDI data if none exists
                midiData = new Midi();
                midiData.addTrack();
                exportButton.disabled = false;
            }
            
            if (midiData.tracks.length === 0) {
                midiData.addTrack();
            }
            
            // Add to first track for now
            const track = midiData.tracks[0];
            const noteName = Tone.Midi(midi).toNote();
            
            track.addNote({
                name: noteName,
                time: time,
                duration: duration,
                velocity: velocity
            });
            
            console.log(`Added note: ${noteName} at ${time}s for ${duration}s`);
        }

        // --- Drawing and UI ---
        function setupToolbar() {
            const tools = ['select', 'pencil', 'cutter'];
            tools.forEach(tool => {
                const btn = document.getElementById(`tool-${tool}`);
                if(btn) btn.addEventListener('click', () => setActiveTool(tool));
            });
            setActiveTool('select'); // Set default tool
            setupKeyboardShortcuts();
            setupContextMenu();
        }

        function setActiveTool(toolName) {
            activeTool = toolName;
            ['select', 'pencil', 'cutter'].forEach(tool => {
                const btn = document.getElementById(`tool-${tool}`);
                if(btn) btn.dataset.active = (tool === toolName);
            });
            gridContainer.style.cursor = toolName === 'pencil' ? 'crosshair' : 'default';
        }

        // --- Keyboard Shortcuts ---
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                // Don't trigger shortcuts when typing in inputs
                if (e.target.tagName === 'INPUT') return;
                
                switch(e.key.toLowerCase()) {
                    case 'v':
                        setActiveTool('select');
                        break;
                    case 'b':
                        setActiveTool('pencil');
                        break;
                    case 'c':
                        setActiveTool('cutter');
                        break;
                    case 'delete':
                    case 'backspace':
                        if (selectedNotes.size > 0) {
                            e.preventDefault();
                            deleteSelectedNotes();
                        }
                        break;
                    case 'arrowup':
                        if (selectedNotes.size > 0) {
                            e.preventDefault();
                            transposeSelectedNotes(e.shiftKey ? 12 : 1);
                        }
                        break;
                    case 'arrowdown':
                        if (selectedNotes.size > 0) {
                            e.preventDefault();
                            transposeSelectedNotes(e.shiftKey ? -12 : -1);
                        }
                        break;
                    case 'arrowleft':
                        if (!e.shiftKey) {
                            e.preventDefault();
                            handlePrevMeasure();
                        }
                        break;
                    case 'arrowright':
                        if (!e.shiftKey) {
                            e.preventDefault();
                            handleNextMeasure();
                        }
                        break;
                    case 'a':
                        if (e.ctrlKey || e.metaKey) {
                            e.preventDefault();
                            selectAllNotes();
                        }
                        break;
                    case 'escape':
                        clearSelection();
                        hideContextMenu();
                        break;
                }
            });
        }

        // --- Context Menu ---
        function setupContextMenu() {
            // Hide context menu on outside click
            document.addEventListener('click', () => hideContextMenu());
            
            // Context menu item actions
            contextMenu.querySelectorAll('.context-menu-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const action = item.dataset.action;
                    handleContextMenuAction(action);
                    hideContextMenu();
                });
            });
        }

        function showContextMenu(x, y) {
            contextMenu.style.left = `${x}px`;
            contextMenu.style.top = `${y}px`;
            contextMenu.style.display = 'block';
        }

        function hideContextMenu() {
            contextMenu.style.display = 'none';
        }

        function handleContextMenuAction(action) {
            switch(action) {
                case 'delete':
                    deleteSelectedNotes();
                    break;
                case 'transpose-up-semitone':
                    transposeSelectedNotes(1);
                    break;
                case 'transpose-down-semitone':
                    transposeSelectedNotes(-1);
                    break;
                case 'transpose-up-octave':
                    transposeSelectedNotes(12);
                    break;
                case 'transpose-down-octave':
                    transposeSelectedNotes(-12);
                    break;
            }
        }

        // --- Plugin Interface Functions ---
        function showPluginInterface() {
            pluginTitle.textContent = `${currentInstrumentType} Parameters`;
            generateParameterControls();
            pluginInterface.style.display = 'block';
        }

        function hidePluginInterface() {
            pluginInterface.style.display = 'none';
        }

        function generateParameterControls() {
            pluginBody.innerHTML = '';
            
            const defs = parameterDefinitions[currentInstrumentType];
            if (!defs) return;
            
            Object.entries(defs).forEach(([sectionName, params]) => {
                const section = document.createElement('div');
                section.className = 'param-section';
                
                const title = document.createElement('div');
                title.className = 'param-section-title';
                title.textContent = sectionName;
                section.appendChild(title);
                
                const grid = document.createElement('div');
                grid.className = 'param-grid';
                
                params.forEach(param => {
                    const control = createParameterControl(param);
                    grid.appendChild(control);
                });
                
                section.appendChild(grid);
                pluginBody.appendChild(section);
            });
        }

        function createParameterControl(param) {
            const container = document.createElement('div');
            container.className = 'param-control';
            
            if (param.type === 'knob') {
                const knobContainer = document.createElement('div');
                knobContainer.className = 'knob-container';
                
                const knob = document.createElement('div');
                knob.className = 'knob';
                
                const value = instrumentParameters[currentInstrumentType][param.name] ?? param.default;
                const rotation = ((value - param.min) / (param.max - param.min)) * 270 - 135;
                knob.style.transform = `rotate(${rotation}deg)`;
                
                const knobValue = document.createElement('div');
                knobValue.className = 'knob-value';
                knobValue.textContent = formatParamValue(value, param);
                
                knob.appendChild(knobValue);
                knobContainer.appendChild(knob);
                container.appendChild(knobContainer);
                
                // Knob interaction
                let isDragging = false;
                let startY = 0;
                let startValue = value;
                
                knob.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    startY = e.clientY;
                    startValue = instrumentParameters[currentInstrumentType][param.name] ?? param.default;
                    e.preventDefault();
                });
                
                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    
                    const deltaY = startY - e.clientY;
                    const range = param.max - param.min;
                    const sensitivity = param.log ? range / 300 : range / 200;
                    let newValue = startValue + (deltaY * sensitivity);
                    
                    if (param.log) {
                        const logMin = Math.log(param.min);
                        const logMax = Math.log(param.max);
                        const logValue = logMin + ((newValue - param.min) / range) * (logMax - logMin);
                        newValue = Math.exp(logValue);
                    }
                    
                    newValue = Math.max(param.min, Math.min(param.max, newValue));
                    
                    const rotation = ((newValue - param.min) / range) * 270 - 135;
                    knob.style.transform = `rotate(${rotation}deg)`;
                    knobValue.textContent = formatParamValue(newValue, param);
                    
                    setInstrumentParameter(currentInstrument, currentInstrumentType, param.name, newValue);
                });
                
                document.addEventListener('mouseup', () => {
                    isDragging = false;
                });
                
            } else if (param.type === 'fader') {
                const faderContainer = document.createElement('div');
                faderContainer.className = 'fader-container';
                
                const track = document.createElement('div');
                track.className = 'fader-track';
                
                const thumb = document.createElement('div');
                thumb.className = 'fader-thumb';
                
                const value = instrumentParameters[currentInstrumentType][param.name] ?? param.default;
                const percentage = 1 - ((value - param.min) / (param.max - param.min));
                thumb.style.top = `${percentage * 100}%`;
                
                faderContainer.appendChild(track);
                faderContainer.appendChild(thumb);
                container.appendChild(faderContainer);
                
                // Fader interaction
                let isDragging = false;
                
                thumb.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    e.preventDefault();
                });
                
                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    
                    const rect = faderContainer.getBoundingClientRect();
                    const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
                    const newValue = param.max - (y * (param.max - param.min));
                    
                    thumb.style.top = `${y * 100}%`;
                    
                    setInstrumentParameter(currentInstrument, currentInstrumentType, param.name, newValue);
                });
                
                document.addEventListener('mouseup', () => {
                    isDragging = false;
                });
                
            } else if (param.type === 'select') {
                const select = document.createElement('select');
                select.className = 'select-control';
                
                param.options.forEach(option => {
                    const optionElement = document.createElement('option');
                    optionElement.value = option;
                    optionElement.textContent = option;
                    select.appendChild(optionElement);
                });
                
                const value = instrumentParameters[currentInstrumentType][param.name] ?? param.default;
                select.value = value;
                
                select.addEventListener('change', (e) => {
                    setInstrumentParameter(currentInstrument, currentInstrumentType, param.name, e.target.value);
                });
                
                container.appendChild(select);
            }
            
            const label = document.createElement('div');
            label.className = 'param-label';
            label.textContent = param.label;
            container.appendChild(label);
            
            return container;
        }

        function formatParamValue(value, param) {
            if (param.log) {
                return value < 1000 ? value.toFixed(0) : (value / 1000).toFixed(1) + 'k';
            }
            if (value >= 1) {
                return value.toFixed(1);
            }
            return value.toFixed(3);
        }

        function draw() {
            if (Tone.Transport.state === 'started') handleStop();
            drawPianoRoll();
            drawTimeline();
            drawGrid();
            updateLoopRegionDisplay();
        }

        function setupPianoKeys() {
            const keys = [];
            for (let midi = MIDI_NOTE_RANGE.max; midi >= MIDI_NOTE_RANGE.min; midi--) {
                const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);
                keys.push({ midi, black: isBlack, name: Tone.Midi(midi).toNote() });
            }

            pianoKeysSVG.innerHTML = '';
            const svgNS = "http://www.w3.org/2000/svg";
            const keyWidth = 80;
            const blackKeyWidth = 50;
            const totalHeight = keys.length * NOTE_HEIGHT;
            
            pianoKeysSVG.setAttribute('viewBox', `0 0 ${keyWidth} ${totalHeight}`);
            pianoKeysSVG.style.height = `${totalHeight}px`;
            noteContainer.style.height = `${totalHeight}px`;
            gridLinesContainer.style.height = `${totalHeight}px`;

            keys.forEach((key, idx) => {
                const y = idx * NOTE_HEIGHT;
                const rect = document.createElementNS(svgNS, 'rect');
                rect.setAttribute('x', 0);
                rect.setAttribute('y', y);
                rect.setAttribute('width', key.black ? blackKeyWidth : keyWidth);
                rect.setAttribute('height', NOTE_HEIGHT);
                rect.setAttribute('class', key.black ? 'piano-key black' : 'piano-key white');
                rect.dataset.midi = key.midi;
                pianoKeysSVG.appendChild(rect);

                if (!key.black) {
                    const text = document.createElementNS(svgNS, 'text');
                    text.setAttribute('x', keyWidth - 5);
                    text.setAttribute('y', y + NOTE_HEIGHT / 2);
                    text.setAttribute('class', 'piano-label');
                    text.textContent = key.name;
                    pianoKeysSVG.appendChild(text);
                }
            });
        }
        
        function drawGrid() {
            gridLinesContainer.innerHTML = '';
            const totalDuration = midiData ? Math.max(midiData.duration, 32) : 32; // Minimum 32 seconds
            const containerWidth = totalDuration * zoom;

            // Horizontal lines (piano keys)
            const numKeys = MIDI_NOTE_RANGE.max - MIDI_NOTE_RANGE.min + 1;
            for (let i = 0; i <= numKeys; i++) {
                const line = document.createElement('div');
                const isBlackKey = [1, 3, 6, 8, 10].includes((MIDI_NOTE_RANGE.max - i) % 12);
                line.className = `absolute w-full h-px ${isBlackKey ? 'bg-zinc-700/75' : 'bg-zinc-800'}`;
                line.style.top = `${i * NOTE_HEIGHT - 1}px`;
                line.style.width = `${containerWidth}px`;
                gridLinesContainer.appendChild(line);
            }
            
            // Vertical lines (time grid)
            const beatsPerMeasure = Tone.Transport.timeSignature[0];
            const secondsPerBeat = 60 / Tone.Transport.bpm.value;
            const secondsPerMeasure = secondsPerBeat * beatsPerMeasure;
            const secondsPerSubdivision = secondsPerBeat / (currentSubdivision / 4);
            
            // Calculate how many subdivisions we need
            const totalSubdivisions = Math.ceil(totalDuration / secondsPerSubdivision);
            
            for (let i = 0; i <= totalSubdivisions; i++) {
                const time = i * secondsPerSubdivision;
                const x = time * zoom;
                
                // Determine line type
                const subdivisionInMeasure = i % (beatsPerMeasure * currentSubdivision / 4);
                const subdivisionInBeat = i % (currentSubdivision / 4);
                
                let lineClass;
                if (subdivisionInMeasure === 0) {
                    lineClass = 'grid-line-major'; // Measure lines
                } else if (subdivisionInBeat === 0) {
                    lineClass = 'grid-line-beat'; // Beat lines
                } else {
                    lineClass = 'grid-line-subdivision'; // Subdivision lines
                }
                
                const line = document.createElement('div');
                line.className = `absolute h-full w-px ${lineClass}`;
                line.style.left = `${x}px`;
                gridLinesContainer.appendChild(line);
            }
        }

        function drawPianoRoll() {
            // Store selected note data before clearing
            const selectedNoteData = Array.from(selectedNotes).map(note => ({
                track: parseInt(note.dataset.track),
                index: parseInt(note.dataset.index)
            }));
            
            noteContainer.innerHTML = '';
            selectedNotes.clear();
            
            // Add snap indicator back after clearing
            const snapIndicatorElement = document.createElement('div');
            snapIndicatorElement.id = 'snap-indicator';
            snapIndicatorElement.className = 'snap-indicator';
            noteContainer.appendChild(snapIndicatorElement);
            
            if (!midiData) {
                const totalDuration = 32; // Default duration
                const containerWidth = Math.max(totalDuration * zoom, gridContainer.clientWidth);
                noteContainer.style.width = `${containerWidth}px`;
                return;
            }

            const totalDuration = Math.max(midiData.duration, 32);
            const containerWidth = Math.max(totalDuration * zoom, gridContainer.clientWidth);
            noteContainer.style.width = `${containerWidth}px`;

            const midiKeys = Array.from({ length: MIDI_NOTE_RANGE.max - MIDI_NOTE_RANGE.min + 1 }, (_, i) => MIDI_NOTE_RANGE.max - i);

            midiData.tracks.forEach((track, trackIndex) => {
                const color = trackColors[trackIndex % trackColors.length];
                track.notes.forEach((note, noteIndex) => {
                    const keyIdx = midiKeys.indexOf(note.midi);
                    if (keyIdx === -1) return;

                    const noteDiv = document.createElement('div');
                    noteDiv.classList.add('note');
                    noteDiv.dataset.track = trackIndex;
                    noteDiv.dataset.index = noteIndex;
                    noteDiv.dataset.midi = note.midi;
                    
                    const y = keyIdx * NOTE_HEIGHT;
                    const x = note.time * zoom;
                    const width = note.duration * zoom;
                    
                    noteDiv.style.top = `${y}px`;
                    noteDiv.style.left = `${x}px`;
                    noteDiv.style.width = `${width}px`;
                    noteDiv.style.height = `${NOTE_HEIGHT - 2}px`;
                    noteDiv.style.backgroundColor = color;
                    noteDiv.style.opacity = note.velocity * 0.7 + 0.3;
                    noteDiv.title = `Track ${trackIndex + 1}\nNote: ${note.name}\nTime: ${note.time.toFixed(2)}s\nVel: ${Math.round(note.velocity * 100)}%`;
                    noteContainer.appendChild(noteDiv);
                    
                    // Restore selection if this note was selected
                    const wasSelected = selectedNoteData.some(data => 
                        data.track === trackIndex && data.index === noteIndex
                    );
                    if (wasSelected) {
                        selectNote(noteDiv);
                    }
                });
            });
        }

        function drawTimeline() {
            timelineContainer.innerHTML = '';
            
            // Calculate timeline parameters
            const beatsPerMeasure = Tone.Transport.timeSignature[0];
            const secondsPerBeat = 60 / Tone.Transport.bpm.value;
            const secondsPerMeasure = secondsPerBeat * beatsPerMeasure;
            const secondsPerSubdivision = secondsPerBeat / (currentSubdivision / 4);
            
            // Determine total duration - either from MIDI or default minimum
            const midiDuration = midiData ? midiData.duration : 0;
            const minDuration = maxMeasures * secondsPerMeasure;
            const totalDuration = Math.max(midiDuration, minDuration);
            
            const containerWidth = totalDuration * zoom;
            timelineContainer.style.width = `${containerWidth}px`;
            timelineContainer.style.position = 'relative';
            timelineContainer.style.zIndex = '35';
            
            // Calculate subdivision count
            const totalSubdivisions = Math.ceil(totalDuration / secondsPerSubdivision);
            
            for (let i = 0; i <= totalSubdivisions; i++) {
                const time = i * secondsPerSubdivision;
                const x = time * zoom;
                
                // Skip if beyond our view to optimize performance
                if (x > containerWidth) break;
                
                // Determine tick type
                const subdivisionInMeasure = i % (beatsPerMeasure * currentSubdivision / 4);
                const subdivisionInBeat = i % (currentSubdivision / 4);
                
                const tick = document.createElement('div');
                tick.className = 'timeline-tick';
                tick.style.left = `${x}px`;
                tick.style.position = 'absolute';
                
                if (subdivisionInMeasure === 0) {
                    // Measure marker
                    const measure = Math.floor(i / (beatsPerMeasure * currentSubdivision / 4)) + 1;
                    tick.classList.add('measure');
                    tick.textContent = measure.toString();
                    tick.style.zIndex = '40';
                } else if (subdivisionInBeat === 0) {
                    // Beat marker
                    const beatInMeasure = Math.floor(subdivisionInMeasure / (currentSubdivision / 4)) + 1;
                    tick.classList.add('beat');
                    tick.style.zIndex = '37';
                    if (currentSubdivision >= 8) { // Only show beat numbers on fine subdivisions
                        tick.textContent = beatInMeasure.toString();
                    }
                } else {
                    // Subdivision marker
                    tick.classList.add('subdivision');
                    tick.style.zIndex = '35';
                    if (currentSubdivision >= 16) { // Only show subdivision numbers on very fine subdivisions
                        const subInBeat = (subdivisionInMeasure % (currentSubdivision / 4)) + 1;
                        tick.textContent = subInBeat.toString();
                    }
                }
                
                timelineContainer.appendChild(tick);
            }
        }

        // --- Piano Key Interaction & Sample Loading ---
        pianoKeysSVG.addEventListener('click', async (e) => {
            if (!e.target.dataset.midi) return;
            const midi = parseInt(e.target.dataset.midi);
            const noteName = Tone.Midi(midi).toNote();
            
            // Always allow sample loading - sampler pitches samples automatically
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'audio/*';
            fileInput.onchange = async (ev) => {
                const file = ev.target.files[0];
                if (!file) return;
                const url = URL.createObjectURL(file);
                sampler.add(noteName, url, () => {
                    console.log(`Sample for ${noteName} loaded.`);
                    samplesLoaded = true;
                    alert(`Sample for ${noteName} loaded successfully!`);
                });
            };
            fileInput.click();
        });

        // --- Playback Controls ---
        function handlePlayPause() {
            if (Tone.Transport.state === 'started') {
                Tone.Transport.pause();
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                stopPlaybackUpdates();
            } else {
                if (!midiData && !isLooping) {
                    // Create a default empty track for practice
                    midiData = new Midi();
                    midiData.addTrack();
                    exportButton.disabled = false;
                }
                
                prepareParts();
                Tone.Transport.start();
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                showPlaybackCursor();
                startPlaybackUpdates();
            }
        }

        function handleStop() {
            Tone.Transport.stop();
            Tone.Transport.position = 0;
            parts.forEach(p => { p.stop(0); p.dispose(); });
            parts = [];
            synths.forEach(s => s.dispose());
            synths = [];
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            hidePlaybackCursor();
            stopPlaybackUpdates();
            updatePlaybackDisplay();
        }

        function handleRewind() {
            if (isLooping) {
                Tone.Transport.seconds = loopStart;
            } else {
                Tone.Transport.position = 0;
            }
            updatePlaybackCursor();
            updatePlaybackDisplay();
        }

        function prepareParts() {
            if (parts.length > 0) handleStop();
            if (!midiData) return;

            midiData.tracks.forEach(track => {
                if (track.notes.length === 0) return;
                
                // Use the current instrument or sampler if samples are loaded
                const instrument = (currentInstrumentType === 'Sampler' && samplesLoaded) ? sampler : currentInstrument;
                
                // For monophonic synths, handle notes differently
                const isMonophonic = ['MonoSynth', 'MembraneSynth', 'MetalSynth'].includes(currentInstrumentType);
                
                const part = new Tone.Part((time, note) => {
                    if (isMonophonic) {
                        // For mono synths, use simple trigger
                        instrument.triggerAttackRelease(note.name, note.duration, time, note.velocity);
                    } else {
                        // For poly synths, standard trigger
                        instrument.triggerAttackRelease(note.name, note.duration, time, note.velocity);
                    }
                }, track.notes).start(0);
                parts.push(part);
            });
        }

        function startPlaybackUpdates() {
            stopPlaybackUpdates();
            playbackUpdateInterval = setInterval(() => {
                updatePlaybackDisplay();
                
                // Handle looping
                if (isLooping && Tone.Transport.seconds >= loopEnd) {
                    Tone.Transport.seconds = loopStart;
                }
            }, 50); // 20fps updates
        }

        function stopPlaybackUpdates() {
            if (playbackUpdateInterval) {
                clearInterval(playbackUpdateInterval);
                playbackUpdateInterval = null;
            }
        }

        // --- Playback Cursor ---
        let cursorAnimationFrame = null;

        function showPlaybackCursor() {
            playbackCursor.style.display = 'block';
            updatePlaybackCursor();
        }

        function hidePlaybackCursor() {
            playbackCursor.style.display = 'none';
            if (cursorAnimationFrame) {
                cancelAnimationFrame(cursorAnimationFrame);
                cursorAnimationFrame = null;
            }
        }

        function updatePlaybackCursor() {
            if (Tone.Transport.state !== 'started') {
                const x = Tone.Transport.seconds * zoom;
                playbackCursor.style.transform = `translateX(${x}px)`;
                if (Tone.Transport.state === "stopped") hidePlaybackCursor();
                return;
            }
            const x = Tone.Transport.seconds * zoom;
            playbackCursor.style.transform = `translateX(${x}px)`;

            const gridRect = gridContainer.getBoundingClientRect();
            if (x > gridContainer.scrollLeft + gridRect.width - 50) {
                gridContainer.scrollLeft = x - gridRect.width + 50;
            } else if (x < gridContainer.scrollLeft + 50) {
                gridContainer.scrollLeft = Math.max(0, x - 50);
            }
            
            cursorAnimationFrame = requestAnimationFrame(updatePlaybackCursor);
        }
    </script>
